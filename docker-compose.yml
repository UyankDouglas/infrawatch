name: infrawatch

services:
  postgres:
    image: postgres:17-alpine
    container_name: infrawatch-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrawatch}
      POSTGRES_USER: ${POSTGRES_USER:-infrawatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrawatch}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - infrawatch-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrawatch} -d ${POSTGRES_DB:-infrawatch}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # --- Serviços de demonstração (seguros, locais, determinísticos) ---
  demo-healthy:
    build: ./apps/demo-services
    container_name: infrawatch-demo-healthy
    environment:
      DEMO_NAME: api-saudavel
      DEMO_MODE: healthy
      PORT: "9101"
    ports:
      - "9101:9101"

  demo-degraded:
    build: ./apps/demo-services
    container_name: infrawatch-demo-degraded
    environment:
      DEMO_NAME: api-degradada
      DEMO_MODE: degraded
      DEMO_LATENCY_MS: "1800"
      PORT: "9102"
    ports:
      - "9102:9102"

  demo-flaky:
    build: ./apps/demo-services
    container_name: infrawatch-demo-flaky
    environment:
      DEMO_NAME: api-instavel
      DEMO_MODE: flaky
      PORT: "9103"
    ports:
      - "9103:9103"

  api:
    build:
      context: ./apps/api
    container_name: infrawatch-api
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      INFRAWATCH_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-infrawatch}
      INFRAWATCH_DB_USER: ${POSTGRES_USER:-infrawatch}
      INFRAWATCH_DB_PASSWORD: ${POSTGRES_PASSWORD:-infrawatch}
      INFRAWATCH_CORS_ORIGINS: http://localhost:${WEB_PORT:-5174}
      INFRAWATCH_SEED_ENABLED: ${INFRAWATCH_SEED_ENABLED:-true}
      INFRAWATCH_DEMO_BASE_URL: http://host.docker.internal
      INFRAWATCH_ALLOWED_HOSTS: localhost,127.0.0.1,host.docker.internal,demo-healthy,demo-degraded,demo-flaky
      INFRAWATCH_DEMO_AGENT_TOKEN: ${INFRAWATCH_DEMO_AGENT_TOKEN:-iwa_demoagnt.local-demo-token-change-me-0001}
      # Fase 5 — integrações externas. Desativadas por padrão; com Mailpit no perfil "observability" é seguro ligar.
      INFRAWATCH_INTEGRATIONS_ENABLED: ${INFRAWATCH_INTEGRATIONS_ENABLED:-false}
      INFRAWATCH_BASE_URL: http://localhost:${WEB_PORT:-5174}
      INFRAWATCH_SMTP_HOST: ${INFRAWATCH_SMTP_HOST:-}
      INFRAWATCH_SMTP_PORT: ${INFRAWATCH_SMTP_PORT:-1025}
      INFRAWATCH_TRACING_SAMPLING: ${INFRAWATCH_TRACING_SAMPLING:-0.0}
      INFRAWATCH_OTLP_ENDPOINT: ${INFRAWATCH_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${API_PORT:-8080}:8080"
      - "127.0.0.1:${MANAGEMENT_PORT:-8081}:8081"

  # Agente de demonstração: roda dentro do próprio container e reporta CPU/RAM/disco/uptime para a API.
  agent-demo:
    build: ./apps/agent
    container_name: infrawatch-agent-demo
    profiles: ["full"]
    depends_on:
      - api
    environment:
      INFRAWATCH_API_URL: http://api:8080
      INFRAWATCH_AGENT_TOKEN: ${INFRAWATCH_DEMO_AGENT_TOKEN:-iwa_demoagnt.local-demo-token-change-me-0001}
      INFRAWATCH_AGENT_INTERVAL: "15"
      INFRAWATCH_AGENT_HOSTNAME: demo-agent
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: ""
    container_name: infrawatch-web
    profiles: ["full"]
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5174}:80"

  # --- Perfil "observability": Prometheus + Grafana (dashboard provisionado), Mailpit (SMTP de teste) e OTel Collector ---
  mailpit:
    image: axllent/mailpit:v1.24
    container_name: infrawatch-mailpit
    profiles: ["observability"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: infrawatch-prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - infrawatch-prometheus:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.0
    container_name: infrawatch-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - infrawatch-grafana:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.131.0
    container_name: infrawatch-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./docker/otel/collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"

volumes:
  infrawatch-pgdata:
  infrawatch-prometheus:
  infrawatch-grafana:
