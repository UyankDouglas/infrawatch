name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compilar
        run: ./mvnw -B -q -DskipTests package
      - name: Testes unitários e de integração (Testcontainers)
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: apps/api/target/surefire-reports

  agent:
    name: Agente (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q package

  frontend:
    name: Frontend (lint + typecheck + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Testes (Vitest)
        run: npm run test -- --run
      - name: Build
        run: npm run build

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    needs: [backend, frontend, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validar docker-compose
        run: docker compose --profile full --profile observability config -q
      - name: Build demo-services
        run: docker build apps/demo-services
      - name: Build API
        run: docker build apps/api
      - name: Build Agent
        run: docker build apps/agent
      - name: Build Web
        run: docker build apps/web

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [docker]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Subir ambiente completo
        run: docker compose --profile full up -d --build
      - name: Aguardar API
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:5174/api/v1/auth/csrf >/dev/null; then echo pronto; exit 0; fi
            sleep 3
          done
          docker compose logs api; exit 1
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:5174
          # A API roda em container: os serviços de demonstração são alcançados via host.docker.internal
          E2E_DEMO_TARGET_HOST: host.docker.internal
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report
      - if: always()
        run: docker compose --profile full down -v
