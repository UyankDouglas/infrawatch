# Atualizações automáticas de dependências (agrupadas por ecossistema, semanalmente).
version: 2
updates:
  - package-ecosystem: maven
    directory: /apps/api
    schedule: { interval: weekly }
    groups:
      spring: { patterns: ["org.springframework*"] }
      others: { patterns: ["*"], exclude-patterns: ["org.springframework*"] }
  - package-ecosystem: maven
    directory: /apps/agent
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    groups:
      web: { patterns: ["*"] }
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
