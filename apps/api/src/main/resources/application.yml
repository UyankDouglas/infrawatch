spring:
  application:
    name: infrawatch-api
  datasource:
    url: ${INFRAWATCH_DB_URL:jdbc:postgresql://localhost:5433/infrawatch}
    username: ${INFRAWATCH_DB_USER:infrawatch}
    password: ${INFRAWATCH_DB_PASSWORD:infrawatch}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  session:
    timeout: 12h
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION
  mail:
    host: ${INFRAWATCH_SMTP_HOST:}
    port: ${INFRAWATCH_SMTP_PORT:1025}
    username: ${INFRAWATCH_SMTP_USERNAME:}
    password: ${INFRAWATCH_SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${INFRAWATCH_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${INFRAWATCH_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
  task:
    scheduling:
      pool:
        size: 2

server:
  port: ${INFRAWATCH_API_PORT:8080}
  servlet:
    session:
      cookie:
        name: INFRAWATCH_SESSION
        http-only: true
        same-site: lax
        secure: ${INFRAWATCH_COOKIE_SECURE:false}
      timeout: 12h
  error:
    include-message: never
    include-stacktrace: never

management:
  server:
    port: ${INFRAWATCH_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  health:
    mail:
      # SMTP é opcional: um servidor de e-mail indisponível não deve derrubar o health check da API.
      enabled: false
  info:
    env:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        infrawatch.engine.checks.duration: true
    tags:
      application: infrawatch-api
  tracing:
    sampling:
      probability: ${INFRAWATCH_TRACING_SAMPLING:0.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${INFRAWATCH_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
    resource-attributes:
      service.name: infrawatch-api

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

infrawatch:
  security:
    cookie-secure: ${INFRAWATCH_COOKIE_SECURE:false}
    cors-allowed-origins: ${INFRAWATCH_CORS_ORIGINS:http://localhost:5174}
    rate-limit:
      auth-requests-per-minute: 20
  monitoring:
    enabled: ${INFRAWATCH_MONITORING_ENABLED:true}
    dispatcher-interval: 5s
    max-concurrent-checks: 8
    batch-size: 50
    min-interval-seconds: 30
    max-timeout-ms: 30000
    max-response-bytes: 65536
    max-redirects: 3
    stale-after-multiplier: 3
    target-policy:
      mode: ALLOWLIST_ONLY
      allowed-hosts: ${INFRAWATCH_ALLOWED_HOSTS:localhost,127.0.0.1,host.docker.internal,demo-healthy,demo-degraded,demo-flaky}
      allowed-ports: ${INFRAWATCH_ALLOWED_PORTS:80,443,8080,8081,9101,9102,9103}
  metrics:
    raw-retention: ${INFRAWATCH_METRICS_RAW_RETENTION:7d}
    rollup-retention: ${INFRAWATCH_METRICS_ROLLUP_RETENTION:90d}
    check-retention: ${INFRAWATCH_CHECK_RETENTION:30d}
    min-ingest-spacing: 5s
    max-clock-skew: 5m
    stale-after-multiplier: 3
  integrations:
    dispatch-enabled: ${INFRAWATCH_INTEGRATIONS_ENABLED:false}
    base-url: ${INFRAWATCH_BASE_URL:http://localhost:5174}
    from-address: ${INFRAWATCH_MAIL_FROM:infrawatch@localhost}
    max-attempts: 5
    expire-after: 6h
    webhook-timeout: 10s
  seed:
    enabled: ${INFRAWATCH_SEED_ENABLED:false}
    demo-base-url: ${INFRAWATCH_DEMO_BASE_URL:http://localhost}
    demo-agent-token: ${INFRAWATCH_DEMO_AGENT_TOKEN:}

logging:
  level:
    com.infrawatch: INFO
    org.springframework.security: WARN
